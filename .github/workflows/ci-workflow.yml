name: Python package
on:
  push:
  pull_request:
    branches: [ dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Ruff
        uses : astral-sh/ruff-action@v3
      - name: Run tests
        run: uv run pytest
      - name: Install vulture
        run: uv pip install vulture
      - name: Find dead code
        run: uv run vulture scripts/ --min-confidence 80
      - name: Install bandit
        run: uv pip install bandit
      - name: Check security
        run: uv run bandit -r ./scripts
      - name: Install detect-secrets
        run: uv pip install detect-secrets
      - name: Detect secrets
        run: git ls-files -z | xargs -0 uv run detect-secrets-hook

